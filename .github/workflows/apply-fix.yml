name: Apply hosting fix

on:
  push:
    branches:
      - fix/pterodactyl-web-ui-security

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch Pterodactyl port and local secrets support
        run: |
          node <<'NODE'
          const fs = require('fs');

          const indexPath = 'index.js';
          let index = fs.readFileSync(indexPath, 'utf8');

          const oldConfig = 'const config = require("./settings.json");';
          const newConfig = `const config = require("./settings.json");
          const { resolveWebPort } = require("./serverConfig");
          const fs = require("fs");
          const path = require("path");

          const localConfigPath = path.join(__dirname, "settings.local.json");
          if (fs.existsSync(localConfigPath)) {
            try {
              const localConfig = JSON.parse(fs.readFileSync(localConfigPath, "utf8"));
              if (localConfig.utils?.["auto-auth"]?.password) {
                config.utils["auto-auth"].password = localConfig.utils["auto-auth"].password;
              }
              if (localConfig["bot-account"]?.password) {
                config["bot-account"].password = localConfig["bot-account"].password;
              }
            } catch (error) {
              throw new Error(`Invalid settings.local.json: ${error.message}`);
            }
          }`;

          if (!index.includes(oldConfig)) throw new Error('Expected settings import not found');
          if (!index.includes('const PORT = process.env.PORT || 5000;')) throw new Error('Expected PORT declaration not found');

          index = index.replace(oldConfig, newConfig);
          index = index.replace('const PORT = process.env.PORT || 5000;', 'const PORT = resolveWebPort(process.env);');

          fs.writeFileSync(indexPath, index);

          const settingsPath = 'settings.json';
          const settings = JSON.parse(fs.readFileSync(settingsPath, 'utf8'));
          if (settings.utils?.['auto-auth']) {
            settings.utils['auto-auth'].password = '';
          }
          fs.writeFileSync(settingsPath, JSON.stringify(settings, null, 2) + '\n');

          const gitignorePath = '.gitignore';
          let gitignore = fs.readFileSync(gitignorePath, 'utf8');
          if (!gitignore.split(/\r?\n/).includes('settings.local.json')) {
            gitignore += (gitignore.endsWith('\n') ? '' : '\n') + 'settings.local.json\n';
          }
          fs.writeFileSync(gitignorePath, gitignore);

          const example = {
            "bot-account": {
              "password": ""
            },
            "utils": {
              "auto-auth": {
                "password": ""
              }
            }
          };
          fs.writeFileSync('settings.local.example.json', JSON.stringify(example, null, 2) + '\n');
          NODE

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Validate JavaScript
        run: node --check index.js

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js settings.json .gitignore settings.local.example.json package.json package-lock.json serverConfig.js test/serverConfig.test.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: support Pterodactyl web port and protect local auth secrets"
          git push origin HEAD:fix/pterodactyl-web-ui-security
