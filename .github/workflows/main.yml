name: Minecraft AFK Bot

on:
  workflow_dispatch:

jobs:
  start-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Download Bot Files
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Start Bot
        run: npm start
